[package]
name = "openclaw-toolkit-desktop"
version = "0.1.2"
description = "OpenClaw Toolkit Desktop"
authors = ["OpenClaw Toolkit"]
edition = "2021"
default-run = "openclaw-toolkit-desktop"

[lib]
name = "openclaw_toolkit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
zip = "2"
tar = "0.4"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
ed25519-dalek = "2"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
semver = "1"
rfd = "0.15"
winreg = "0.55"
remove_dir_all = { version = "1", features = ["parallel"] }
dunce = "1"
